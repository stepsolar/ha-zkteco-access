name: ZKTeco Access
version: "1.0.1"
slug: zkteco_access
description: >-
  Controllo accessi ZKTeco C3/inBio (sostituisce ZKAccess 3.5 sul PC): apertura porte,
  tessere RFID su una o più porte, livelli, fasce orarie, eventi in tempo reale ed entità Home Assistant.
url: https://github.com/stepsolar/ha-zkteco-access
arch:
  - aarch64
  - amd64
  - armv7
  - armhf
  - i386
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:door-closed-lock
panel_title: Controllo accessi
services:
  - mqtt:want
map:
  - share:rw
ports:
  8099/tcp: null
ports_description:
  8099/tcp: API REST diretta (facoltativa, richiede api_token)
options:
  log_level: info
  poll_interval: 1
  timeout: 4
  sync_time_on_connect: true
  auto_disable_expired: true
  mqtt_enabled: true
  mqtt_topic: zkteco_access
  discovery_prefix: homeassistant
  import_path: /share/zkaccess.mdb
  api_token: ""
schema:
  log_level: list(debug|info|warning|error)
  poll_interval: float(0.5,10)
  timeout: float(1,20)
  sync_time_on_connect: bool
  auto_disable_expired: bool
  mqtt_enabled: bool
  mqtt_topic: str
  discovery_prefix: str
  import_path: str?
  api_token: password?
  mqtt_host: str?
  mqtt_port: port?
  mqtt_user: str?
  mqtt_password: password?
